<div class="container">
    <form class="form mat-elevation-z8">

        <h1>helpdesk dicas de um dev </h1>

        <img src="assets/img/login-image.svg" alt="">
            
        <mat-form-field class = "full-width" appearande="fill">
            <mat-label>E-mail</mat-label>
            <input
            [formControl]="email"
            required
            [(ngModel)]="creds.email" name="email" 
            matInput placeholder="Ex. fulano@mail.com">
        </mat-form-field>

        <mat-form-field class = "full-width" appearande="fill">
            <mat-label>Senha</mat-label>
            <input 
             [formControl]="senha"
            required
            [(ngModel)]="creds.senha" name="senha"
            type="password"  matInput placeholder="123">
        </mat-form-field>

        <button (click)="logar()" [disabled]="!validaCampos()" class = "full-width mat-elevation-z4" mat-straked-button color="primary">Login</button>
        {{creds.email}}
    </form>

</div>
